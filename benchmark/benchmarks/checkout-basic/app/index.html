<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bench Shop — Sign in</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="panel">
    <h1>Bench Shop</h1>
    <form id="login-form" novalidate>
      <label for="username">Username</label>
      <input id="username" data-test="username" autocomplete="username">

      <label for="password">Password</label>
      <input id="password" type="password" data-test="password" autocomplete="current-password">

      <button type="submit" data-test="login-button">Sign in</button>
    </form>

    <p class="error" data-test="error" hidden></p>
    <p class="hint">Demo credentials: <code>demo_user</code> / <code>demo_pass</code></p>
  </main>

  <script src="app.js"></script>
  <script>initLogin();</script>
</body>
</html>
