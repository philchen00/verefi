name: E2E Tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  playwright:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # Keep the default target local. Do not set E2E_ALLOW_REMOTE here: a
      # remote target requires an explicit, reviewed CI configuration.
      BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx --no-install playwright install --with-deps chromium

      # Prefer Playwright's `webServer` config for starting and waiting for a
      # local app. If the app needs another command or port, update both this
      # BASE_URL and the config together before enabling the workflow.
      - name: Run Playwright tests
        run: npx --no-install playwright test

      # Reports can contain URLs, page content, and screenshots. Upload them
      # only after a repository owner enables the UPLOAD_PLAYWRIGHT_REPORTS
      # Actions variable, and retain them briefly.
      - name: Upload HTML report
        if: ${{ always() && vars.UPLOAD_PLAYWRIGHT_REPORTS == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 3
