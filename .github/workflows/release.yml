name: Create GitHub Release

# claude plugin tag --push (see CONTRIBUTING.md's Releasing section) creates
# and pushes a verefi--v<version> tag. A bare tag has no entry in GitHub's
# Releases sidebar and no changelog — this turns that tag into a real
# Release with auto-generated notes, without changing how tags get cut.

on:
  push:
    tags:
      - "verefi--v*"

permissions:
  contents: write

jobs:
  release:
    name: Create release for ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # full history so --generate-notes can find the previous tag

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" \
            --title "${{ github.ref_name }}" \
            --generate-notes
